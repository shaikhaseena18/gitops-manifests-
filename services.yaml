apiVersion: v1
kind: Service
metadata:
  name: vote-service

spec:
  type: LoadBalancer

  selector:
    app: vote

  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: result-service

spec:
  type: LoadBalancer

  selector:
    app: result

  ports:
  - port: 80
    targetPort: 80
